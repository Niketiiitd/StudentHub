services:
  - type: web
    name: studenthub
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: TOKEN_KEY
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRY
        value: 2h
      - key: ACCESS_REFRESH_TOKEN
        sync: false
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
